name: V813 TEST4 genuine Android APK emulator matrix
on:
  push:
    branches:
      - research/v813-test4-android-public
    paths:
      - '.github/workflows/v813-test4-android.yml'
      - 'test4/android_public_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-real-emulator:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: L1 script syntax and official Kiwi APK retrieval
        run: |
          python3 -m py_compile test4/android_public_probe.py kiwi-android-lab/download_kiwi.py
          python3 kiwi-android-lab/download_kiwi.py
      - name: Enable host KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
      - name: Android API ${{ matrix.api }} boot, app install, GUI, network dispatch and relaunch
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST4_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 test4/android_public_probe.py
      - name: Preserve status even when runtime fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v813-test4-android-api${{ matrix.api }}-public-evidence
          path: out/
          if-no-files-found: warn
          retention-days: 7
