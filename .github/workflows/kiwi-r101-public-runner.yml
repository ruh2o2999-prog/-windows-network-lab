name: Kiwi R101 public runner canary (no private code)
on:
  push:
    branches:
      - kiwi-r101-public-avd-probe
    paths:
      - '.github/workflows/kiwi-r101-public-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Test real GitHub runner provisioning
        run: |
          echo "R101_PUBLIC_RUNNER_PROVISIONED=true"
          uname -m
          test -e /etc/os-release
