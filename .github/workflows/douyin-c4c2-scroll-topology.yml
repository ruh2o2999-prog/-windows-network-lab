name: Douyin C4C2 Android11 Native Scroll Topology Evidence
on:
  push:
    branches: [douyin-c4c2-scroll-topology-20261112]
    paths:
      - '.github/workflows/douyin-c4c2-scroll-topology.yml'
      - 'c4c2_public_probe/C4C2_public_probe.zip.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c4c2-android11-scroll-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified public research archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4c2_exp
          base64 -d c4c2_public_probe/C4C2_public_probe.zip.b64 > c4c2_exp/payload.zip
          echo 'fbcf632961225e5a9efbe3e2fb0aeb40891514d01b8b2ce86020d961e87a4713  c4c2_exp/payload.zip' | sha256sum -c -
          unzip -q c4c2_exp/payload.zip -d c4c2_exp
          test -s c4c2_exp/C4C2_Android11_Research.apk
          bash -n c4c2_exp/run_c4c2_android11.sh
      - name: Prepare hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Android11 native WebView baseline and bounded touch gesture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash c4c2_exp/run_c4c2_android11.sh
      - name: Upload direct Android11 evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-c4c2-android11-scroll-topology-evidence
          path: c4c2_results/
          retention-days: 14
          if-no-files-found: warn
