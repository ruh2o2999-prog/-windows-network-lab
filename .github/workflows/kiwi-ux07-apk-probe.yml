name: Kiwi UX07 official Android 137 APK inspection
on:
  push:
    branches:
      - kiwi-ux07-apk-probe-20261110
    paths:
      - .github/workflows/kiwi-ux07-apk-probe.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KIWI_URL: https://github.com/kiwibrowser/src.next/releases/download/14310011181/com.kiwibrowser.browser.dev-arm64-14310011181-github.apk
    steps:
      - name: Retrieve official Kiwi 137 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 480 -o kiwi.dev.arm64.apk "$KIWI_URL"
          test "$(stat -c '%s' kiwi.dev.arm64.apk)" = '243967287'
          file kiwi.dev.arm64.apk
      - name: Inspect actual Android package resources
        shell: bash
        run: |
          python -m pip -q install brotli
          python - <<'PY'
          import zipfile,hashlib,json,struct,pathlib,gzip,brotli
          apk=pathlib.Path('kiwi.dev.arm64.apk')
          out=pathlib.Path('output');out.mkdir(exist_ok=True)
          report={'asset':'com.kiwibrowser.browser.dev-arm64-14310011181-github.apk','bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          with zipfile.ZipFile(apk) as z:
              infos=z.infolist()
              report['zip_valid']=z.testzip() is None
              report['entry_count']=len(infos)
              report['matching_names']=[{'name':i.filename,'size':i.file_size} for i in infos if any(s in i.filename.lower() for s in ['.pak','devtools','inspector','grit','resources','front_end'])][:300]
              packs=[]
              for info in infos:
                  if not info.filename.lower().endswith('.pak'):continue
                  record={'name':info.filename,'size':info.file_size}
                  try:
                      if info.file_size>150_000_000:raise ValueError('pak above inspection limit')
                      data=z.read(info)
                      version=struct.unpack_from('<I',data)[0]
                      if version==4:
                          rc,enc=struct.unpack_from('<IB',data,4);aliases=0;header=9
                      elif version==5:
                          enc,rc,aliases=struct.unpack_from('<BxxxHH',data,4);header=12
                      else:raise ValueError('unrecognized GRIT pack version '+str(version))
                      record.update({'version':version,'encoding':enc,'resources':rc,'aliases':aliases,'pack_sha256':hashlib.sha256(data).hexdigest()})
                      if rc>65535 or header+(rc+1)*6+aliases*4>len(data):raise ValueError('invalid index bounds')
                      markers=(b'devtools_app',b'../shell/shell.js',b'inspector_main',b'panels/sources',b'panels/elements',b'DevTools')
                      matches=[];decompression_attempts=0
                      for idx in range(rc):
                          rid,begin=struct.unpack_from('<HI',data,header+6*idx)
                          _,end=struct.unpack_from('<HI',data,header+6*(idx+1))
                          if begin>end or end>len(data):raise ValueError('bad resource offset at '+str(idx))
                          payload=data[begin:end]
                          found=[m.decode('utf-8') for m in markers if m in payload]
                          typ='raw'
                          if not found and len(payload)>=512 and len(payload)<=12_000_000 and decompression_attempts<2400:
                              decompression_attempts+=1
                              for how,fn in [('gzip',gzip.decompress),('brotli',brotli.decompress)]:
                                  try:
                                      decoded=fn(payload)
                                      if len(decoded)>40_000_000:continue
                                      found=[m.decode('utf-8') for m in markers if m in decoded]
                                      if found:typ=how;break
                                  except (Exception,MemoryError):pass
                          if found:matches.append({'resource_id':rid,'offset':begin,'compressed_bytes':len(payload),'markers':found,'encoding':typ,'sha256':hashlib.sha256(payload).hexdigest()})
                      record['devtools_marked_resources']=matches[:150]
                      record['matches_count']=len(matches)
                      record['decompression_attempts']=decompression_attempts
                  except Exception as e:record['inspection_error']=repr(e)
                  packs.append(record)
              report['packs']=packs
          (out/'kiwi_apk_probe.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps({'bytes':report['bytes'],'zip_valid':report['zip_valid'],'entry_count':report['entry_count'],'name_hits':len(report['matching_names']),'packs':[{'name':p['name'],'resources':p.get('resources'),'matches':p.get('matches_count'),'error':p.get('inspection_error')} for p in report['packs']]},indent=2))
          PY
      - name: Extract candidate Chromium resources from official APK
        shell: bash
        run: |
          python - <<'PY'
          import zipfile,json,hashlib,struct,gzip,pathlib,re
          apk=pathlib.Path('kiwi.dev.arm64.apk');root=pathlib.Path('output')
          report=json.loads((root/'kiwi_apk_probe.json').read_text())
          rec=next(x for x in report['packs'] if x['name']=='assets/resources.pak')
          matches=rec.get('devtools_marked_resources',[])
          out=[]
          with zipfile.ZipFile(apk) as z:
              data=z.read('assets/resources.pak')
              rc=struct.unpack_from('<H',data,8)[0] if struct.unpack_from('<I',data,0)[0]==5 else struct.unpack_from('<I',data,4)[0]
              header=12 if struct.unpack_from('<I',data,0)[0]==5 else 9
              resources={}
              for i in range(rc):
                  rid,start=struct.unpack_from('<HI',data,header+6*i)
                  _,end=struct.unpack_from('<HI',data,header+6*(i+1))
                  resources[rid]=data[start:end]
              for c in matches:
                  rid=c['resource_id'];raw=resources[rid]
                  if raw[:2]==b'\x1f\x8b':decoded=gzip.decompress(raw)
                  else:decoded=raw
                  filename=f'resource_{rid}_decoded.bin'
                  (root/filename).write_bytes(decoded)
                  out.append({'resource_id':rid,'bytes':len(decoded),'decoded_sha256':hashlib.sha256(decoded).hexdigest(),'first_500_repr':repr(decoded[:500]),'possible_strings':[x.decode('utf8','replace')[:200] for x in re.findall(rb'[\x20-\x7E]{12,}',decoded)[:12]],'file':filename})
          (root/'candidate_details.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:14000])
          PY
      - name: Extract Kiwi Android host DEX and resource evidence
        shell: bash
        run: |
          python - <<'PY'
          import zipfile,pathlib,hashlib,json
          out=pathlib.Path('output/host');out.mkdir(parents=True,exist_ok=True)
          selected=[];native=[]
          with zipfile.ZipFile('kiwi.dev.arm64.apk') as z:
              for info in z.infolist():
                  name=info.filename
                  native.append({'name':name,'bytes':info.file_size}) if (name.startswith('lib/') and name.endswith('.so')) else None
                  if name=='AndroidManifest.xml' or name=='assets/resources.pak' or (name.startswith('classes') and name.endswith('.dex')):
                      if info.file_size > 70_000_000:continue
                      raw=z.read(info)
                      target=out/name.replace('/','__')
                      target.write_bytes(raw)
                      selected.append({'name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'out':target.name})
          metadata={'selected':selected,'native_libs':sorted(native,key=lambda e:e['bytes'],reverse=True)[:50]}
          (out/'host_inventory.json').write_text(json.dumps(metadata,indent=2))
          print(json.dumps(metadata,indent=2)[:15000])
          PY
      - name: Decompile Kiwi native DevTools Java call sites
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --max-time 180 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          mkdir -p /tmp/jadx /tmp/jadx_out output/selected_sources
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx -j 4 --no-res -d /tmp/jadx_out output/host/classes.dex >/tmp/jadx.log 2>&1 || true
          python - <<'PY'
          import pathlib,json,shutil
          root=pathlib.Path('/tmp/jadx_out/sources')
          out=pathlib.Path('output/selected_sources')
          matches=[]
          for p in root.rglob('*.java'):
              try:s=p.read_text(errors='replace')
              except Exception:continue
              needles=['setUseSoftMenu','devtools://','openDevTools','DevToolsServer','AppMenuBridge','DebuggingServer']
              hits=[n for n in needles if n in s]
              if not hits:continue
              rel=p.relative_to(root);target=out/rel;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
              matches.append({'path':str(rel),'size':p.stat().st_size,'hits':hits})
          (out/'devtools_java_index.json').write_text(json.dumps({'matches':matches,'jadx_log_tail':pathlib.Path('/tmp/jadx.log').read_text(errors='replace')[-5000:]},ensure_ascii=False,indent=2))
          print(json.dumps(matches[:60],indent=2))
          PY
      - name: Verify official Kiwi DEX smali disassemble-reassemble
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --max-time 120 -o /tmp/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar
          curl -fL --retry 4 --retry-all-errors --max-time 120 -o /tmp/smali.jar https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar
          echo "37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  /tmp/baksmali.jar" | sha256sum -c -
          echo "32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  /tmp/smali.jar" | sha256sum -c -
          mkdir -p /tmp/smali_kiwi
          java -jar /tmp/baksmali.jar disassemble output/host/classes.dex -o /tmp/smali_kiwi
          find /tmp/smali_kiwi -name '*.smali' | wc -l
          java -jar /tmp/smali.jar assemble /tmp/smali_kiwi -o output/host/classes.roundtrip.dex
          python - <<'PY'
          import pathlib,json,hashlib,shutil
          root=pathlib.Path('/tmp/smali_kiwi');out=pathlib.Path('output/host')
          found=[]
          for p in root.rglob('*.smali'):
              try:s=p.read_text()
              except Exception:continue
              if 'setUseSoftMenu' in s and 'devtools://' in s:
                  target=out/'kiwi_devtools_injection.smali'
                  shutil.copyfile(p,target)
                  found.append({'source':str(p.relative_to(root)),'copied':str(target),'sha256':hashlib.sha256(s.encode()).hexdigest(),'occurrences':s.count('setUseSoftMenu')})
          dex=(out/'classes.roundtrip.dex').read_bytes()
          source=(out/'classes.dex').read_bytes()
          result={'original_size':len(source),'roundtrip_size':len(dex),'dex_header':dex[:8].hex(),'roundtrip_sha256':hashlib.sha256(dex).hexdigest(),'original_sha256':hashlib.sha256(source).hexdigest(),'target_matches':found,'success':dex[:4]==b'dex\n' and len(found)==1 and b'setUseSoftMenu' in dex}
          (out/'smali_roundtrip_report.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if not result['success']:raise SystemExit('DEX roundtrip check failed')
          PY
      - name: Publish resource inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-137-official-apk-resource-probe
          path: output/
          retention-days: 14
