name: Kiwi R121 automatic enhanced CDP and passive security G4 Android
on:
  push:
    branches: [kiwi-r121-auto-safety-g4-20261114]
    paths:
      - 'kiwi-r121-lab/trigger/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kiwi-production-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: R121 targeted Android G4 preflight, reuse installed Kiwi route
        run: |
          set -euo pipefail
          python3 -m pip install -q websocket-client==1.8.0
          python3 -m py_compile kiwi-r121-lab/r121_android_g4.py kiwi-r109-lab/r109_history_recovery.py kiwi-r104-lab/r104-production-network-test.py kiwi-android-lab/download_kiwi.py
          mkdir -p out
          python3 kiwi-android-lab/download_kiwi.py
          python3 - <<'PY_R121'
          from pathlib import Path
          p=Path('kiwi-r104-lab/r104-production-network-test.py')
          s=p.read_text(encoding='utf8')
          needle="    snapshot('r103_formal_manager_final')"
          assert s.count(needle)==1,'Kiwi original successful install seam changed; fail closed'
          addition="\n".join([
            "    sys.path.insert(0,str(Path('kiwi-r109-lab').absolute()))",
            "    sys.path.insert(0,str(Path('kiwi-r121-lab').absolute()))",
            "    from r121_android_g4 import execute as r121_execute",
            "    r121_execute(run,snapshot,state,type_internal_url,tap_target,tap_text_any)",
            "    return"])
          s=s.replace(needle,needle+'\n'+addition)
          p.write_text(s,encoding='utf8')
          print('R121_NATIVE_TARGETED_RUNNER_PATCH_PASS')
          PY_R121
      - name: Publish one-time receiver certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -keyout /tmp/r103-private-key.pem -out /tmp/r103-certificate.pem -sha256 -days 1 -nodes -subj '/CN=KiwiR121Ephemeral/' >/dev/null 2>&1
          chmod 600 /tmp/r103-private-key.pem
          mkdir -p exchange
          cp /tmp/r103-certificate.pem "exchange/r121-run-${GITHUB_RUN_ID}.crt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "exchange/r121-run-${GITHUB_RUN_ID}.crt"
          git commit -m "ci(r115): one-time receiver certificate run ${GITHUB_RUN_ID}"
          git push origin HEAD:kiwi-r121-auto-safety-g4-20261114
          echo "R121_PUBLIC_CERT_READY=exchange/r121-run-${GITHUB_RUN_ID}.crt"
      - name: Receive session ciphertext, decrypt on ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          NAME="exchange/r121-run-${GITHUB_RUN_ID}.p7m.b64"
          FOUND=0
          for attempt in $(seq 1 180); do
            git fetch -q origin '+refs/heads/kiwi-r121-auto-safety-g4-20261114:refs/remotes/origin/kiwi-r121-auto-safety-g4-20261114'
            if git show "origin/kiwi-r121-auto-safety-g4-20261114:${NAME}" > /tmp/r103-package.p7m.b64 2>/dev/null; then
              FOUND=1
              break
            fi
            sleep 5
          done
          if [ "$FOUND" != 1 ]; then echo 'R121_PRIVATE_TRANSFER_TIMEOUT'; exit 23; fi
          base64 -d /tmp/r103-package.p7m.b64 > /tmp/r103-package.p7m
          openssl cms -decrypt -binary -inform DER -in /tmp/r103-package.p7m -recip /tmp/r103-certificate.pem -inkey /tmp/r103-private-key.pem -out /tmp/kiwi-r104-production.zip
          python3 - <<'PY'
          import zipfile,hashlib,json
          p='/tmp/kiwi-r104-production.zip'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            m=json.loads(z.read('manifest.json'))
            assert m['manifest_version']==2 and m['version']=='0.4.59' and m.get('version_name','').startswith('0.4.59-rc5-r121-hf1')
          expected='5a61187f35ecc77a5515760acd59b6085d3965d5235e27ef7634e7820d15a6d8'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()==expected
          report={'source':'R121 encrypted session-specific MV2 archive','sha256':expected,'bytes':__import__('os').path.getsize(p),'version':m['version'],'name':m['name']}
          open('out/formal_package_provenance.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          print('R121_DECRYPTED_CRC_SHA_PINNED',json.dumps(report,ensure_ascii=False))
          PY
          rm -f /tmp/r103-package.p7m /tmp/r103-package.p7m.b64
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -la /dev/kvm || true
      - name: Android11 official Kiwi R121 automatic enhancement and passive security
        uses: reactivecircus/android-emulator-runner@v2
        env:
          R103_PRODUCTION_ZIP: /tmp/kiwi-r104-production.zip
          R110_EXPECTED_VERSION: '0.4.59'
          R110_EXPECTED_SHA256: 5a61187f35ecc77a5515760acd59b6085d3965d5235e27ef7634e7820d15a6d8
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 kiwi-r104-lab/r104-production-network-test.py
      - name: Erase ephemeral private package, keys and raw task exports
        if: always()
        run: rm -f /tmp/kiwi-r104-production.zip /tmp/r103-private-key.pem /tmp/r103-certificate.pem /tmp/r103-export-recovered.zip /tmp/r108-real-post-restart-historical.zip
      - name: Save real screenshots, logs, status; never upload plugin plaintext
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-r121-android-g4-original-evidence
          path: out/
          if-no-files-found: warn
