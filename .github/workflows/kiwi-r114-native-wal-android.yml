name: Kiwi R114 original extension WAL Worker persistence and CRC gates
on:
  push:
    branches: [kiwi-r114-native-wal-android]
    paths:
      - 'kiwi-r114-lab/trigger/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kiwi-production-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight scripts and release
        run: |
          python3 -m pip install -q websocket-client==1.8.0
          python3 -m py_compile kiwi-r114-lab/r114_native_wal_probe.py kiwi-r112-lab/r112_native_opfs_probe.py kiwi-r109-lab/r109_history_recovery.py kiwi-r108-lab/r108_restart_history.py kiwi-r108-lab/r108_offline_recovery_parity.py kiwi-r107-lab/r107_response_body_parity.py kiwi-r107-lab/test_r107_response_body_parity.py kiwi-android-lab/download_kiwi.py kiwi-r104-lab/r104-production-network-test.py kiwi-r104-lab/r104_capture_reconcile.py kiwi-r104-lab/controlled_fixture_server.py kiwi-r104-lab/r104_network_strict_parity.py kiwi-r104-lab/test_r104_network_strict_parity.py
          mkdir -p out
          python3 kiwi-android-lab/download_kiwi.py
          python3 - <<'PY_R114'
          from pathlib import Path
          p=Path('kiwi-r104-lab/r104-production-network-test.py')
          s=p.read_text(encoding='utf8')
          needle='                r112_execute(run,snapshot,state,OUT,fixture_url,type_internal_url,find_extensions_via_kiwi_menu)'
          extra="\n".join([
           "                sys.path.insert(0,str(Path('kiwi-r114-lab').absolute()))",
           "                from r114_native_wal_probe import execute as r114_execute",
           "                r114_execute(run,snapshot,state,OUT,fixture_url,type_internal_url,find_extensions_via_kiwi_menu)"])
          assert s.count(needle)==1,'R114 injection seam changed, fail closed'
          p.write_text(s.replace(needle,needle+'\n'+extra),encoding='utf8')
          print('R114_RUNNER_SEAM_PATCH_PASS')
          PY_R114
      - name: Publish one-time certificate (NOT private key) into isolated branch
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -keyout /tmp/r103-private-key.pem -out /tmp/r103-certificate.pem -sha256 -days 1 -nodes -subj '/CN=KiwiR103Ephemeral/' >/dev/null 2>&1
          chmod 600 /tmp/r103-private-key.pem
          mkdir -p exchange
          cp /tmp/r103-certificate.pem "exchange/r114-run-${GITHUB_RUN_ID}.crt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "exchange/r114-run-${GITHUB_RUN_ID}.crt"
          git commit -m "ci(r103): publish one-time test receiver certificate for run ${GITHUB_RUN_ID}"
          git push origin HEAD:kiwi-r114-native-wal-android
          echo "R110_PUBLIC_CERT_READY=exchange/r114-run-${GITHUB_RUN_ID}.crt"
      - name: Receive public ciphertext, decrypt ONLY on transient runner
        shell: bash
        run: |
          set -euo pipefail
          NAME="exchange/r114-run-${GITHUB_RUN_ID}.p7m.b64"
          FOUND=0
          for attempt in $(seq 1 180); do
            git fetch -q origin '+refs/heads/kiwi-r114-native-wal-android:refs/remotes/origin/kiwi-r114-native-wal-android'
            if git show "origin/kiwi-r114-native-wal-android:${NAME}" > /tmp/r103-package.p7m.b64 2>/dev/null; then
              FOUND=1
              break
            fi
            sleep 5
          done
          if [ "$FOUND" != 1 ]; then echo 'R110_PRIVATE_TRANSFER_TIMEOUT'; exit 23; fi
          base64 -d /tmp/r103-package.p7m.b64 > /tmp/r103-package.p7m
          openssl cms -decrypt -binary -inform DER -in /tmp/r103-package.p7m -recip /tmp/r103-certificate.pem -inkey /tmp/r103-private-key.pem -out /tmp/kiwi-r104-production.zip
          python3 - <<'PY'
          import zipfile,hashlib,json
          p='/tmp/kiwi-r104-production.zip'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            m=json.loads(z.read('manifest.json'))
            assert m['manifest_version']==2 and m['version']=='0.4.59' and m.get('version_name','').startswith('0.4.59-rc2-hf1')
          assert hashlib.sha256(open(p,'rb').read()).hexdigest() == 'aabbb2235edcfb2378711d35297e769e43416629cecfc3dd98d915c915fbc1c1'
          report={'source':'Encrypted session-specific R100 MV2 archive','sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'bytes':__import__('os').path.getsize(p),'version':m['version'],'name':m['name']}
          open('out/formal_package_provenance.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          print('R114_DECRYPTED_HF1_CRC_VERIFIED',json.dumps(report,ensure_ascii=False))
          PY
          shred -u /tmp/r103-private-key.pem /tmp/r103-package.p7m /tmp/r103-package.p7m.b64 || true
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -la /dev/kvm || true
      - name: Android 11 Google APIs actual Kiwi formal extension test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          R103_PRODUCTION_ZIP: /tmp/kiwi-r104-production.zip
          R110_EXPECTED_VERSION: '0.4.59'
          R110_EXPECTED_SHA256: aabbb2235edcfb2378711d35297e769e43416629cecfc3dd98d915c915fbc1c1
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 kiwi-r104-lab/r104-production-network-test.py
      # R111 REAL EXPORTS: the only raw ZIPs are under /tmp on the ephemeral runner.
      # Export to public Artifact ONLY as RSA-recipient-encrypted CMS ciphertext.
      # The receiver private key is never present in GitHub or the runner.
      - name: R111 encrypt actual before-and-after Android ZIP evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 kiwi-r110-lab/r111_archive_android_exports.py \
            --before /tmp/r103-export-recovered.zip \
            --after /tmp/r108-real-post-restart-historical.zip \
            --out out/r111_secure_raw_exports \
            --cert kiwi-r110-lab/certs/r111_receiver_public.crt \
            --expected-cert-sha 8656cbdbb793f979cc4b9c5cd9ccbb9486199d3a0a9d345476fee8e6330e1b36 \
            --status out/status.json \
            --before-manifest out/r103_export_zip_manifest.json \
            --after-manifest out/r108_historical_real_download_manifest.json \
            --verifier kiwi-r108-lab/r108_offline_recovery_parity.py \
            --run-id "${GITHUB_RUN_ID}"
          test -s out/r111_secure_raw_exports/R111_android_real_before.zip.p7m
          test -s out/r111_secure_raw_exports/R111_android_real_historical.zip.p7m
      - name: Remove transient decrypted formal ZIP
        if: always()
        run: rm -f /tmp/kiwi-r104-production.zip /tmp/r103-private-key.pem /tmp/r103-export-recovered.zip /tmp/r108-real-post-restart-historical.zip
      - name: Preserve only logs, screenshots and structured results (never package)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-r114-real-worker-wal-cold-restart-and-crc-evidence
          path: out/
          if-no-files-found: warn
