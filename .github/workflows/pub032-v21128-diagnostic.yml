name: PUB-032 V2.11.2.8 diagnostic-only internal input read
on:
  push:
    branches: [publisher-v21128-pub032-native-20261112]
    paths:
      - '.github/workflows/pub032-v21128-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pub032-real-v21128:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect Windows x64 and validate actual GUI script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out,exchange | Out-Null
          $tokens=$null;$parseErr=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ci/pub032v21128/run_v21128_gui.ps1').Path,[ref]$tokens,[ref]$parseErr) | Out-Null
          if($parseErr.Count){ throw "PowerShell parser rejected native GUI script: $($parseErr | Out-String)" }
          python -m py_compile ci/pub032v21128/verify_v21128.py
          if($LASTEXITCODE){throw 'Python payload verifier parser failure'}
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "PUB032_REAL_WINDOWS_OS=$($os.Caption);BUILD=$($os.BuildNumber);ARCH=$($os.OSArchitecture)"
          if($os.OSArchitecture -notmatch '64'){throw 'Windows is not x64'}
      - name: Create transient RSA3072 certificate and publish ONLY public certificate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $openssl='C:\Program Files\Git\usr\bin\openssl.exe'
          if(!(Test-Path $openssl)){$openssl=(Get-Command openssl.exe -ErrorAction Stop).Source}
          $key=Join-Path $env:RUNNER_TEMP 'pub032_v21128_private.pem'
          $cert=Join-Path $env:RUNNER_TEMP 'pub032_v21128_public.crt'
          & $openssl req -x509 -newkey rsa:3072 -keyout $key -out $cert -sha256 -days 1 -nodes -subj '/CN=PUB032V21128Windows/' 2>$null
          if($LASTEXITCODE){throw 'Temporary RSA generation failure'}
          $dest="exchange/pub032-v21128-diag-run-$env:GITHUB_RUN_ID.crt"
          Copy-Item $cert $dest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $dest
          git commit -m "ci: V2.11.2.8 public one-time cert run $env:GITHUB_RUN_ID"
          if($LASTEXITCODE){throw 'Public certificate commit failure'}
          git push origin HEAD:publisher-v21128-pub032-native-20261112
          if($LASTEXITCODE){throw 'Public certificate push failure'}
          Write-Host "PUB032_V21128_CERT_READY=$dest"
      - name: Receive only CMS-encrypted private binary and real P0-50 fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $prefix="exchange/pub032-v21128-diag-run-$env:GITHUB_RUN_ID"
          $branch='publisher-v21128-pub032-native-20261112'
          $cipher=Join-Path $env:RUNNER_TEMP 'pub032_v21128_cipher.p7m'
          $found=$false
          for($attempt=0;$attempt -lt 180;$attempt++){
            git fetch -q origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            if($LASTEXITCODE){throw 'Cipher branch fetch failure'}
            $value=git show "origin/${branch}:$prefix.p7m.b64" 2>$null
            if($LASTEXITCODE -eq 0 -and $value){
              [IO.File]::WriteAllBytes($cipher,[Convert]::FromBase64String(($value -join '').Trim()))
              $found=$true
              break
            }
            Start-Sleep -Seconds 5
          }
          if(!$found){throw 'Timed out waiting for encrypted fixture; no real EXE executed'}
          $openssl='C:\Program Files\Git\usr\bin\openssl.exe'
          if(!(Test-Path $openssl)){$openssl=(Get-Command openssl.exe -ErrorAction Stop).Source}
          $plain=Join-Path $env:RUNNER_TEMP 'pub032_v21128_plain.zip'
          & $openssl cms -decrypt -binary -inform DER -in $cipher -recip (Join-Path $env:RUNNER_TEMP 'pub032_v21128_public.crt') -inkey (Join-Path $env:RUNNER_TEMP 'pub032_v21128_private.pem') -out $plain
          if($LASTEXITCODE){throw 'RSA-AES CMS decryption failed'}
          $expectedPkgSha='504cabc63227daa3dbd821c7dc558bc2d9722b008adf85011b8a1331c97908f1'
          if((Get-FileHash $plain -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedPkgSha){throw 'Encrypted handoff plaintext archive has wrong SHA256'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=Join-Path $env:RUNNER_TEMP 'pub032v21128'
          [IO.Compression.ZipFile]::ExtractToDirectory($plain,$root)
          $expected=Get-Content (Join-Path $root 'expected.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($expected.version -ne 'V2.11.2.8' -or $expected.expected_count -ne 34 -or $expected.original_P050_test_fixture -ne $true -or $expected.diagnostic_build -ne $true){throw 'Not expected DIAGNOSTIC fixture, refusing to imply official product test'}
          if((Get-FileHash (Join-Path $root 'publisher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '89f62723eae7d5ad6d3d87aa6078cd4d7b93d95c684cc78eacaa8a9281c3a749'){throw 'Wrong publisher EXE'}
          if((Get-FileHash (Join-Path $root 'source_p050_34.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a357affc922bcd43e59aa9ffd40652b51259c13af0f81cf1316008deb9720abc'){throw 'Wrong P0-50 fixture'}
          @{stage='DECRYPTED_IN_EPHEMERAL_WINDOWS';version='V2.11.2.8';publisher_sha256=$expected.publisher_sha256;fixture_sha256=$expected.source_zip_sha256;fixture_files=34;archive_sha256=$expectedPkgSha;public_repository_plaintext='NONE';diagnostic_only=$true} |
            ConvertTo-Json | Set-Content 'out/pub032_v21128_handoff_proof.json'
          Remove-Item $plain,$cipher,(Join-Path $env:RUNNER_TEMP 'pub032_v21128_private.pem') -Force -ErrorAction SilentlyContinue
          Write-Host 'PUB032_DIAGNOSTIC_INSTRUMENTED_EXE_AND_P050_AVAILABLE_ON_WINDOWS'
      - name: Run DIAGNOSTIC instrumented V2.11.2.8 GUI with original P0-50 test fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -File ci/pub032v21128/run_v21128_gui.ps1
          if($LASTEXITCODE){throw "Actual V2.11.2.8 publisher GUI returned $LASTEXITCODE"}
      - name: Independent verify actual generated install EXE payload 34 by SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=Join-Path $env:RUNNER_TEMP 'pub032v21128'
          python ci/pub032v21128/verify_v21128.py 'out/PUB032_V21128_34_REAL_P050_INSTALL.exe' (Join-Path $r 'source_p050_34.zip') (Join-Path $r 'expected.json') 'out/pub032_v21128_payload_audit.json'
          if($LASTEXITCODE){throw 'Actual publisher generated exe did not match P0-50 source 34/34'}
          Write-Host 'PUB032_V21128_REAL_WINDOWS_PUBLISHER_EXE_PAYLOAD_34_34_SHA256_MATCH'
      - name: Privacy cleanup on runner
        if: always()
        shell: pwsh
        run: |
          foreach($n in @('pub032v21128','pub032_v21128_plain.zip','pub032_v21128_cipher.p7m','pub032_v21128_private.pem','pub032_v21128_public.crt')){
            $p=Join-Path $env:RUNNER_TEMP $n
            if(Test-Path $p){Remove-Item $p -Force -Recurse -ErrorAction SilentlyContinue}
          }
          $exe='out/PUB032_V21128_34_REAL_P050_INSTALL.exe'
          if(Test-Path $exe){Remove-Item $exe -Force -ErrorAction SilentlyContinue}
          Get-ChildItem out -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "EVIDENCE_FILE=$($_.Name)" }
      - name: Upload sanitized reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub032-v21128-diagnostic-windows-gui-sanitized-evidence
          path: |
            out/pub032_v21128_handoff_proof.json
            out/pub032_v21128_publisher_report.json
            out/pub032_v21128_gui_trace.json
            out/pub032_v21128_payload_audit.json
          if-no-files-found: warn
