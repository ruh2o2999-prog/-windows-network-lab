name: Kiwi R108 source and frozen recovery gate preflight
on:
  push:
    branches: [kiwi-r108-android-restart-persistence]
    paths:
      - 'kiwi-r108-lab/**'
      - 'kiwi-r104-lab/r104-production-network-test.py'
      - '.github/workflows/kiwi-r108-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile R108 Android ADB/UI recovery harness and inherited R107 code
        run: |
          set -euo pipefail
          python3 -m py_compile kiwi-r108-lab/r108_restart_history.py kiwi-r104-lab/r104-production-network-test.py kiwi-r107-lab/r107_response_body_parity.py
          echo 'R108_STATIC_SOURCE_PASS; Android force-stop and restored evidence remain NOT_RUN in this job'
      - name: Save original code and SHA only
        if: always()
        run: |
          mkdir -p out
          sha256sum kiwi-r108-lab/*.py kiwi-r104-lab/r104-production-network-test.py > out/r108_preflight_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-r108-source-preflight-evidence
          path: |
            out/*
            kiwi-r108-lab/*.py
          if-no-files-found: warn
