name: P006 pinned CMFA mihomo public API compatibility
on:
  push:
    branches: [clashmeta-p006-api-contract]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install Android NDK cross compiler (preinstalled SDK CLI)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKM"
          "$SDKM" 'ndk;29.0.14206865' 'platforms;android-35'
      - name: Fetch exact published CMFA and mihomo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone --filter=blob:none https://github.com/MetaCubeX/ClashMetaForAndroid.git upstream
          git -C upstream checkout 215e017ae88ac2a1edf24fdb520512c1423c89f4
          git -C upstream submodule update --init --recursive
          test "$(git -C upstream rev-parse HEAD)" = 215e017ae88ac2a1edf24fdb520512c1423c89f4
          test "$(git -C upstream rev-parse HEAD:core/src/foss/golang/clash)" = 0455d0d28c4526937380505153e65a843d8612e8
          git -C upstream submodule status --recursive > evidence/submodules.txt
      - name: Compile published API contract against actual pinned core
        shell: bash
        run: |
          set -euo pipefail
          cp p006-public-api-contract_test.go upstream/core/src/main/golang/native/tun/p006_public_api_contract_test.go
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1
          export CC="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$CC"
          printf 'GOOS=%s GOARCH=%s CGO_ENABLED=%s CC=%s\n' "$GOOS" "$GOARCH" "$CGO_ENABLED" "$CC" > evidence/target-env.txt
          (cd upstream/core/src/main/golang && go test -c -vet=off -o "$GITHUB_WORKSPACE/p006-android-arm64.test" ./native/tun) 2>&1 | tee evidence/go-api-compile.txt
          file p006-android-arm64.test > evidence/compiled-binary-type.txt
          sha256sum p006-android-arm64.test > evidence/compiled-binary-sha256.txt
          grep -q 'ELF 64-bit' evidence/compiled-binary-type.txt
      - name: Capture build identity
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          go version > evidence/go-version.txt
          printf 'This is a public-interface compiler only: no protected UID guard, no APK, no leak verification.\n' > evidence/NOT_RELEASE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p006-public-upstream-api-contract-evidence
          path: evidence/
          if-no-files-found: warn
